<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 48" fill="none">
  <!-- Flask/beaker icon -->
  <g transform="translate(4, 2)">
    <!-- Flask body -->
    <path d="M14 8V18L6 36C5 38 6.5 40.5 9 40.5H31C33.5 40.5 35 38 34 36L26 18V8" 
          stroke="url(#logoGradW)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Flask top rim -->
    <path d="M12 8H28" stroke="url(#logoGradW)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Liquid level -->
    <path d="M9.5 30C12 28 16 32 20 30C24 28 28 32 30.5 30L31 36C31 38.5 29 40.5 27 40.5H13C11 40.5 9 38.5 9 36L9.5 30Z" 
          fill="white" opacity="0.15"/>
    <!-- Bubbles -->
    <circle cx="16" cy="32" r="1.5" fill="#CADCFC"/>
    <circle cx="22" cy="28" r="1" fill="#CADCFC"/>
    <circle cx="24" cy="34" r="1.3" fill="#CADCFC"/>
    <!-- Molecular dots -->
    <circle cx="8" cy="4" r="2" fill="white"/>
    <circle cx="32" cy="4" r="2" fill="#CADCFC"/>
    <line x1="10" y1="4" x2="30" y2="4" stroke="#CADCFC" stroke-width="1" stroke-dasharray="2 2"/>
    
    <defs>
      <linearGradient id="logoGradW" x1="6" y1="4" x2="34" y2="40" gradientUnits="userSpaceOnUse">
        <stop stop-color="white"/>
        <stop offset="1" stop-color="#CADCFC"/>
      </linearGradient>
    </defs>
  </g>
  
  <!-- Brand text -->
  <text x="50" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="white" letter-spacing="-0.02em">Etomidate</text>
  <text x="50" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#CADCFC" letter-spacing="-0.02em">Hub</text>
  <text x="82" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="white" opacity="0.6" letter-spacing="0.08em">.com</text>
</svg>

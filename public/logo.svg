<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 48" fill="none">
  <!-- Modern atom/molecule icon -->
  <g transform="translate(4, 4)">
    <!-- Outer ring -->
    <circle cx="20" cy="20" r="18" stroke="url(#gradient1)" stroke-width="2.5" fill="none"/>
    
    <!-- Orbital paths -->
    <ellipse cx="20" cy="20" rx="14" ry="5.5" fill="none" stroke="url(#gradient1)" stroke-width="1.5" opacity="0.55"/>
    <ellipse cx="20" cy="20" rx="14" ry="5.5" fill="none" stroke="url(#gradient1)" stroke-width="1.5" opacity="0.55" transform="rotate(60 20 20)"/>
    <ellipse cx="20" cy="20" rx="14" ry="5.5" fill="none" stroke="url(#gradient1)" stroke-width="1.5" opacity="0.55" transform="rotate(120 20 20)"/>
    
    <!-- Nucleus -->
    <circle cx="20" cy="20" r="4.5" fill="url(#gradient1)"/>
    
    <!-- Small electrons -->
    <circle cx="20" cy="5" r="1.6" fill="#f59e0b"/>
    <circle cx="7" cy="26" r="1.6" fill="#ea7a17"/>
    <circle cx="33" cy="26" r="1.6" fill="#f59e0b"/>
    
    <!-- Gradient definition -->
    <defs>
      <linearGradient id="gradient1" x1="2" y1="2" x2="38" y2="38" gradientUnits="userSpaceOnUse">
        <stop stop-color="#f59e0b"/>
        <stop offset="1" stop-color="#ea7a17"/>
      </linearGradient>
    </defs>
  </g>
  
  <!-- Brand text -->
  <text x="52" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#1f2937" letter-spacing="-0.02em">Etomidate</text>
  <text x="52" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#f59e0b" letter-spacing="-0.02em">Site</text>
  <text x="100" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#ea7a17" letter-spacing="0.08em">.com</text>
</svg>


